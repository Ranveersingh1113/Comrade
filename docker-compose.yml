# Comrade, deployable.
#
# THE SPLIT THAT MATTERS. `repo_run` executes a team's code in a container, so
# the agent worker needs a Docker daemon. A normal application container on
# Fly/Render/Railway does not have one. So the agent worker is pinned to a host
# with a Docker socket; the API, the pipeline worker and the frontend can go
# anywhere. Pretending one image fits everywhere is how this fails on the day
# somebody connects a repository.
#
# Postgres is NOT here. Comrade's whole authorization model is Supabase RLS
# plus four separate database roles, and a bare postgres container has none of
# that. Point this at a Supabase project — hosted, or `npx supabase start`
# locally.
services:
  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: [.env]
    environment:
      # The table owner is NOT a runtime credential. shared.db refuses it to
      # any process that has not called allow_table_owner(), and this blanks it
      # out of the environment as well — a credential a process cannot use is
      # still a credential an attacker can read out of it. Migrations run in
      # the one-off `migrate` service below, which is the only thing that gets
      # this value.
      COMRADE_DB_URL_ADMIN: ""
    # NO DOCKER SOCKET, deliberately. The API is the internet-facing process and
    # the one that proxies a team's own code; the socket is root on the host, so
    # granting it here would turn a request-handling bug into a host compromise.
    # Only the two workers get it.
    #
    # The API is the ONLY thing that can reach a preview. Each preview gets its
    # OWN internal network and the worker attaches this container to that one
    # network; nothing is shared between previews, so one team's development
    # server cannot reach another's — or reach this API, which a single shared
    # network previously allowed.
    networks: [default]
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      # /health, not /ready: this decides whether to RESTART the container, and
      # a stalled queue or a migration behind is not something restarting the
      # API fixes. /ready is for the load balancer and the deploy check.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Documents, memory compilation, repository clones, environment builds.
  pipeline-worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["python", "-m", "pipeline.worker"]
    env_file: [.env]
    environment:
      # As above: the table owner is not a runtime credential.
      COMRADE_DB_URL_ADMIN: ""
    restart: unless-stopped
    volumes:
      # The host Docker daemon later bind-mounts these same checkout paths into
      # sandbox containers, so this must be a host bind mount, not a named volume.
      - ${COMRADE_WORKSPACES_ROOT:-/workspaces}:/workspaces
      # 🔴 THIS WORKER NEEDS THE DAEMON TOO, and did not have it. It runs
      # dependency setup (pipeline/repo_env.py -> repo_deps.install ->
      # run_setup), which starts a container. Without the socket every
      # environment build failed with "Docker is not available" — a message
      # that reads like a daemon problem rather than a missing mount.
      - /var/run/docker.sock:/var/run/docker.sock
    # uid 10001 against a root:docker socket, so group membership is what makes
    # it usable. Explicit because the gid differs per host and a wrong one
    # fails at runtime rather than at build.
    group_add: ["${COMRADE_DOCKER_GID:-999}"]
    # Long enough for the drain to finish the job in hand. Both workers catch
    # SIGTERM and stop after the current item rather than abandoning a lease
    # that then takes minutes to expire.
    stop_grace_period: 120s

  # Agent turns. THIS is the one that needs Docker.
  agent-worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["python", "-m", "agent.worker"]
    env_file: [.env]
    environment:
      # As above: the table owner is not a runtime credential.
      COMRADE_DB_URL_ADMIN: ""
    restart: unless-stopped
    volumes:
      - ${COMRADE_WORKSPACES_ROOT:-/workspaces}:/workspaces
      # The sandbox runs as a sibling container, not a child. The bind mounts
      # it passes are resolved by the HOST daemon, so the workspaces volume
      # must be mounted at the same path on the host — see docs/deployment.md.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${COMRADE_DOCKER_GID:-999}"]
    stop_grace_period: 300s

  # The one-off migration job, and the ONLY service given the table owner.
  #
  # `profiles` keeps it out of `docker compose up`: it is a task, not a
  # process, and a migrator that restarts with the stack would race the code
  # it is migrating for. scripts/deploy_host.sh runs it between build and
  # activate.
  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: [.env]
    profiles: ["migrate"]
    restart: "no"
    command: ["python", "-m", "shared.migrations"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # BUILD arguments, not runtime environment: Vite bakes them into the
        # bundle. Setting them on the running container changes nothing.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_AGENT_API_URL: ${VITE_AGENT_API_URL}
    ports: ["8080:80"]
    restart: unless-stopped
    depends_on: [api]

networks:
  default:
# No shared preview network. Each preview process gets its own `--internal`
# network created at start and removed at stop (agent/processes.py), with the
# API attached to that one network only. COMRADE_PREVIEW_PROXY_CONTAINER names
# this API container so the worker knows what to attach.
