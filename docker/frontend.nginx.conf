server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # A single-page app owns its own routes. Without this, /t/<team>/threads/<id>
  # is a 404 on reload and on every link anyone shares — the route only ever
  # works if the visitor arrived via the client-side router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable; index.html must not be, or a deploy is
  # invisible to anyone whose browser still holds the old one.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
