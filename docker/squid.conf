# The registry egress policy for the dependency-install phase.
#
# 🔴 WHY THIS FILE EXISTS (fix.md F06, and the hackathon preflight).
# `agent/sandbox.py:run_setup` runs a repository's own build hooks — pip's
# setup.py, npm's postinstall — as root, WITH a network. It refuses to run at
# all unless COMRADE_SETUP_PROXY_URL and COMRADE_SETUP_PROXY_CONTAINER are both
# set, because the alternative it replaced was unrestricted egress and
# exfiltration is the failure that leaves no trace in a diff.
#
# The sandbox runs on a Docker network created with --internal: no gateway, so a
# direct IP, a DNS lookup, an IPv6 address, a redirect and 169.254.169.254 all
# fail for the same reason — there is nowhere to go. This proxy is attached to
# that network and is the ONLY way out. What it will fetch is what follows.
#
# WHAT THIS HONESTLY DOES NOT DO. It matches on the hostname the client asks
# for. For HTTPS that is the CONNECT target, so the policy is "which host may
# you open a tunnel to", not "what may travel inside it" — the same guarantee
# every corporate egress proxy gives, and it is a real boundary rather than a
# complete one. A package that is itself malicious still runs its hooks inside
# the sandbox; the container is that boundary, and nothing of Comrade's is in
# it.

http_port 3128

# ---------------------------------------------------------------------------
# The allowlist. Everything else is denied by the last rule.
# ---------------------------------------------------------------------------
# pypi.org serves the index and files.pythonhosted.org the archives; pip, uv
# and poetry all need both, and `pip install uv "poetry>=2"` is how the setup
# script obtains the last two (pipeline/repo_deps.py). registry.npmjs.org
# serves npm and pnpm — pnpm is baked into the sandbox image at build time
# precisely so corepack does not need to fetch it from somewhere unlisted.
#
# Leading dots match subdomains. Adding a host here widens what a repository's
# install hooks can reach, so it is a decision, not a convenience.
acl registries dstdomain pypi.org .pythonhosted.org .npmjs.org

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Squid's own management interface is not something a repository's build hook
# has any business reaching, and it is on this same port.
http_access deny manager

# A tunnel may only be opened to 443. Without this, CONNECT to an allowlisted
# name on any port would be permitted, which turns the allowlist into a
# hostname check on an arbitrary service.
http_access deny CONNECT !SSL_ports
http_access deny !Safe_ports

http_access allow registries

# 🔴 THE LOAD-BEARING LINE. Default deny, and it is last on purpose: the
# metadata endpoint, the Docker host, the api and database containers this
# proxy can itself reach on its other network, and every arbitrary destination
# are all refused here by not being named above.
http_access deny all

# ---------------------------------------------------------------------------
# No cache, no state.
# ---------------------------------------------------------------------------
# A cache would make repeat installs faster and would also mean this container
# holds copies of a team's dependencies between runs. It is not worth the
# question; installs are already off the chat path.
cache deny all
cache_store_log none

# Denials go to the container log, so `docker logs` is the evidence that the
# policy is doing something rather than a claim that it is.
logfile_rotate 0
access_log stdio:/dev/stdout squid
cache_log stdio:/dev/stderr

# Nothing downstream needs to know which container asked. `via` is left on:
# RFC 9110 requires a proxy to announce itself and squid warns when it does not,
# and hiding it buys nothing here — the registries can see a proxy either way.
forwarded_for delete

# 🔴 No pid file. Squid writes /var/run/squid.pid as its unprivileged user and
# /var/run is root-owned, so the default made it exit with
#
#     FATAL: failed to open /var/run/squid.pid: (13) Permission denied
#
# A pid file is for an init system signalling a daemon; this runs in the
# foreground under Docker, which signals it directly.
pid_filename none

# Small and predictable: this serves package managers, not browsers.
pipeline_prefetch off
shutdown_lifetime 5 seconds
